name: Build and Push Docker Images

on:
  push:
    branches:
      - dev1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag build image
        run: |
          docker build -t node-app:build-latest -f Dockerfile.build .
          docker tag node-app:build-latest ${{ vars.DOCKER_USERNAME }}/node-app:build-${{ github.sha }} || docker image
          docker image ls

      - name: Push build image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/node-app:build-${{ github.sha }}

      - name: Build and tag dev image
        run: |
          docker build -t node-app:dev-latest -f Dockerfile.dev .
          docker tag node-app:dev-latest ${{ vars.DOCKER_USERNAME }}/node-app:dev-${{ github.sha }}
          docker image ls

      - name: Push dev image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/node-app:dev-${{ github.sha }}

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Deploy with Docker Compose
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker-compose -f docker-compose-build-dev.yaml up -d

      - name: Check running Docker containers
        run: |
          echo "Listing all Docker containers:"
          docker ps -a
