name: CI - Test & Build Docker Image

on:
  push:
    branches:
      - dev1
  pull_request:
    branches:
      - dev1

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  build:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test # Runs only if tests pass

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      ## build docker image and push to docker hub
      - name: Build Docker Image
        run: |
          docker build -t charansaig1/react-sample-docker-app10-02:latest -f Dockerfile.build .

      - name: Tag Docker Image
        run: |
          docker tag charansaig1/react-sample-docker-app10-02:latest charansaig1/react-sample-docker-app10-02:${{ github.sha }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push charansaig1/react-sample-docker-app10-02:${{ github.sha }}
