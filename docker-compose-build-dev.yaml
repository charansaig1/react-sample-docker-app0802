version: '3.8'

services:
  build:
    image: "${DOCKER_USERNAME}/node-app:build-${GITHUB_SHA}"
    ports:
      - "3001:3000"
    depends_on:
      - dev

  dev:
    image: "${DOCKER_USERNAME}/node-app:dev-${GITHUB_SHA}"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    ports:
      - "3002:3000"
